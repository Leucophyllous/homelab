services:
  ollama:
    image: ollama/ollama:0.34.4
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ./data:/root/.ollama
    ports:
      - "${TAILSCALE_IP}:11434:11434"
    cpus: 1.5
