services:
  mcp:
    build: .
    container_name: mcp-server
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - /root/.ssh/mcp_pi:/app/keys/mcp_pi:ro
      - /root/.ssh/mcp_pve:/app/keys/mcp_pve:ro
      - /root/.ssh/oci_mcp:/app/keys/oci_mcp:ro
      - /root/.ssh/known_hosts_mcp:/app/keys/known_hosts:ro
      - /root/.oci:/root/.oci:ro
      - /opt/stacks/mcp/tokens.json:/app/tokens.json
      - /opt/stacks/mcp/proton-cal-config:/root/.config/proton-cal
      - /opt/stacks/mcp/secrets/github_token:/app/secrets/github_token:ro
      - /etc/letsencrypt/live/${MCP_DOMAIN}/fullchain.pem:/app/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/${MCP_DOMAIN}/privkey.pem:/app/certs/privkey.pem:ro
networks: {}
