# orangepi: NUT secondary + battery-event Telegram notifier + daily host-config
# backup to backup-storage. Added 2026-09-25.
#
# Secrets (telegram_bot_token, telegram_chat_id, hc_orangepi_config_url,
# nut_monitor_password)
# come from host_vars/orangepi/local.yml, which is NOT committed to
# git (see .gitignore) — create it locally before running this role.

- name: nut netclient (secondary of the NUT primary)
  ansible.builtin.lineinfile:
    path: /etc/nut/nut.conf
    regexp: "^MODE="
    line: "MODE=netclient"
  notify: restart nut-monitor

- name: upsmon MONITOR points at the NUT primary as secondary
  ansible.builtin.lineinfile:
    path: /etc/nut/upsmon.conf
    regexp: "^MONITOR "
    line: "MONITOR apc500@{{ nut_server }} 1 monsecondary {{ nut_monitor_password }} secondary"
  no_log: true
  notify: restart nut-monitor

- name: local NUT driver/upsd disabled (the UPS is no longer USB-attached here)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: [nut-server.service, nut-driver@apc500.service, nut-driver-enumerator.path, nut-driver-enumerator.service]

- name: nut-telegram notifier script
  ansible.builtin.copy:
    src: nut-telegram
    dest: /usr/local/sbin/nut-telegram
    mode: "0755"

- name: telegram.env (nut group-readable, not world-readable)
  ansible.builtin.template:
    src: telegram.env.j2
    dest: /etc/nut/telegram.env
    owner: root
    group: nut
    mode: "0640"

- name: upsmon.conf uses nut-telegram + all event types notify
  ansible.builtin.lineinfile:
    path: /etc/nut/upsmon.conf
    regexp: "^NOTIFYCMD "
    line: "NOTIFYCMD /usr/local/sbin/nut-telegram"
  notify: restart nut-monitor

- name: upsmon.conf NOTIFYFLAG lines present (every event -> EXEC)
  ansible.builtin.lineinfile:
    path: /etc/nut/upsmon.conf
    regexp: "^NOTIFYFLAG {{ item }} "
    line: "NOTIFYFLAG {{ item }} SYSLOG+WALL+EXEC"
  loop: [ONBATT, ONLINE, LOWBATT, FSD, SHUTDOWN, REPLBATT, COMMBAD, COMMOK, NOCOMM]
  notify: restart nut-monitor

- name: orangepi-config-backup script
  ansible.builtin.template:
    src: orangepi-config-backup.j2
    dest: /usr/local/sbin/orangepi-config-backup
    mode: "0700"

- name: daily config backup cron (03:15)
  ansible.builtin.copy:
    dest: /etc/cron.d/orangepi-config-backup
    content: "15 3 * * * root /usr/local/sbin/orangepi-config-backup\n"
    mode: "0644"
