all:
  vars:
    ansible_become: true
    nut_server: 192.168.0.100   # NUT primary (UPS USB is attached to pve02)
  children:
    pve_cluster:
      vars:
        ssh_hardening: false   # root password login kept intentionally on pve/pve02
      hosts:
        pve:
          ansible_connection: local
          nut_shutdown_delay: 360
          cpu_governor: powersave
          cpu_epp: balance_performance
        pve02:
          ansible_host: 192.168.0.100
          ansible_user: root
          nut_shutdown_delay: 300
          nut_primary: true
          cpu_governor: schedutil
    docker_hosts:
      hosts:
        docker-vm:
          ansible_host: 192.168.0.113
          ansible_user: leila
          docker_mtu: 1454
          acl_allow: [172.16.0.0/12]
        pi:
          ansible_host: 192.168.0.243
          ansible_user: root
          acl_allow: [192.168.0.113]
        mcp-a1:
          ansible_host: 100.69.245.48
          ansible_user: ubuntu
          ansible_ssh_private_key_file: /root/.ssh/oci_mcp
          docker_api_acl: false
    lxc:
      hosts:
        ct121:
          ansible_host: 192.168.0.124
          ansible_user: root
        ct126:
          ansible_host: 192.168.0.126
          ansible_user: leila
          ssh_permit_root_login: "no"
        ct142:
          ansible_host: 192.168.0.142
          ansible_user: root
        ct146:
          ansible_host: 192.168.0.146
          ansible_user: root
    others:
      hosts:
        orangepi:
          ansible_host: 192.168.0.183
          ansible_user: orangepi
          ssh_hardening: false
